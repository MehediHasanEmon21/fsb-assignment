services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fsb-task-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fsb-task

  nginx:
    image: nginx:1.29-alpine
    container_name: fsb-task-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - app_vendor:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - fsb-task

  mysql:
    image: mysql:8.4
    container_name: fsb-task-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-saas_tenant}
      MYSQL_USER: ${DB_USERNAME:-saas_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-me}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-change-root-me}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - fsb-task

  redis:
    image: redis:8-alpine
    container_name: fsb-task-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - fsb-task

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fsb-task-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: >
      sh -c "until [ -f vendor/autoload.php ]; do
      echo 'Waiting for Composer dependencies...';
      sleep 2;
      done;
      php artisan queue:work redis --sleep=1 --tries=3 --timeout=90"
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fsb-task

networks:
  fsb-task:
    driver: bridge

volumes:
  mysql_data:
  app_vendor:
